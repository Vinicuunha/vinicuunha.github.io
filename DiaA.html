<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia A - Peito e Tríceps</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Segunda-Feira: Peito e Tríceps</h1>

    <div class="exercise">
        <p>Supino Reto (barra ou halteres): 3x12</p>
        <img src="https://www.hipertrofia.org/blog/wp-content/uploads/2017/09/barbell-bench-press.gif"
            alt="Supino Reto">
    </div>

    <div class="exercise">
        <p>Supino Inclinado (halteres): 3x12</p>
        <img src="https://www.hipertrofia.org/blog/wp-content/uploads/2023/05/dumbbell-incline-bench-press.gif"
            alt="Supino Inclinado">
    </div>

    <div class="exercise">
        <p>Crucifixo (máquina ou halteres): 3x12</p>
        <img src="https://www.hipertrofia.org/blog/wp-content/uploads/2023/09/lever-seated-fly.gif" alt="Crucifixo">
    </div>

    <div class="exercise">
        <p>Paralelas (foco em tríceps): 3x12</p>
        <img src="https://www.mundoboaforma.com.br/wp-content/uploads/2020/12/paralelas.gif" alt="Paralelas">
    </div>

    <div class="exercise">
        <p>Tríceps Testa (barra): 3x12</p>
        <img src="https://www.hipertrofia.org/blog/wp-content/uploads/2024/02/barbell-lying-triceps-extension-skull-crusher.gif"
            alt="Tríceps Testa">
    </div>

    <div class="exercise">
        <p>Tríceps Pulley (corda): 3x12</p>
        <img src="https://media.tenor.com/mbebKudZjxYAAAAM/tr%C3%ADceps-pulley.gif" alt="Tríceps Pulley">
    </div>

    <a href="home.html" class="btn-voltar fixo">Voltar</a>

</body>

</html>
