<body>

    <h1>Quarta-Feira: Pernas e Panturrilhas</h1>

    <div class="exercise">
        <p>Agachamento Smith (barra): 3x12</p>
        <img src="https://www.hipertrofia.org/blog/wp-content/uploads/2017/11/smith-full-squat.gif" alt="Agachamento Smith">
    </div>

    <div class="exercise">
        <p>Leg Press: 3x12</p>
        <img src="https://media.tenor.com/e0qeS17dv7QAAAAM/legpress45-leg-press.gif" alt="Leg Press">
    </div>

    <div class="exercise">
        <p>Cadeira Extensora: 3x12</p>
        <img src="https://www.hipertrofia.org/blog/wp-content/uploads/2023/11/lever-leg-extension.gif" alt="Cadeira Extensora">
    </div>

    <div class="exercise">
        <p>Mesa Flexora: 3x12</p>
        <img src="https://media.tenor.com/fj_cZPprAyMAAAAM/gym.gif" alt="Mesa Flexora">
    </div>

    <div class="exercise">
        <p>Cadeira Flexora: 3x12</p>

    </div>

    <div class="exercise">
        <p>Cadeira Abdutora: 3x12</p>
        <img src="https://www.hipertrofia.org/blog/wp-content/uploads/2024/09/lever-seated-hip-abduction.gif" alt="Cadeira Abdutora">
    </div>

    <div class="exercise">
        <p>Cadeira Adutora: 3x12</p>
        <img src="https://karoldeliberato.com.br/wp-content/uploads/2023/04/image26-1.gif" alt="Cadeira Adutora">
    </div>

        <p>Panturrilha em Pé ou Sentado: 4x12</p>
        <img src="https://www.hipertrofia.org/blog/wp-content/uploads/2018/10/lever-seated-calf-raise-.gif" alt="Panturrilha">
    </div>
